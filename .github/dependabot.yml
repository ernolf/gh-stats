# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The libraries the site ships: site.yml reads their versions and
  # integrities from site/package-lock.json.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      site:
        patterns:
          - "*"
