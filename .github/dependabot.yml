# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The libraries the site ships: site.yml reads their versions and
  # integrities from site/package-lock.json.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      site:
        patterns:
          - "*"

  # The actions of the workflows that ncmake does not manage. The ones it
  # manages, listed in .github/workflows/.ncmake-workflows.json, stay out: a
  # change by Dependabot would make ncmake flag them as locally modified and
  # stop updating them. dependabot-excludes.yml checks that this list matches.
  - package-ecosystem: github-actions
    directory: "/"
    exclude-paths:
      - ".github/workflows/block-unconventional-commits.yml"
      - ".github/workflows/branch-cleanup.yml"
      - ".github/workflows/lint-shell.yml"
      - ".github/workflows/lint-web.yml"
      - ".github/workflows/reuse.yml"
      - ".github/workflows/workflow-updater.yml"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns:
          - "*"
