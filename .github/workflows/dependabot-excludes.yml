#
# Dependabot updates the actions of every workflow that the github-actions
# block of dependabot.yml does not exclude, and it has to exclude exactly the
# workflows that ncmake manages. A pull request that changes either list, such
# as one that installs or drops an ncmake workflow, fails here until both agree.

name: Dependabot excludes

on:
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/.ncmake-workflows.json

permissions:
  contents: read

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the excludes with the ncmake workflows
        run: |
          managed="$(jq -r 'keys[] | ".github/workflows/" + .' .github/workflows/.ncmake-workflows.json | sort)"
          excluded="$(yq '.updates[] | select(.["package-ecosystem"] == "github-actions") | .["exclude-paths"][]' .github/dependabot.yml | sort)"
          if [ "$managed" != "$excluded" ]; then
            echo "::error::The exclude-paths of the github-actions block in .github/dependabot.yml differ from the workflows in .github/workflows/.ncmake-workflows.json"
            diff <(echo "$managed") <(echo "$excluded") || true
            exit 1
          fi
          echo "Dependabot excludes the $(wc -l <<<"$managed") workflows that ncmake manages"
