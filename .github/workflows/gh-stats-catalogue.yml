# SPDX-License-Identifier: MIT
#
# Keeps an extract of the App Store catalogue in the data branch and sends the
# versions that are new in it, and those that were never measured, to the
# measurement. The sampler workflow fetches the catalogue and dispatches this
# one after every run, so the App Store is asked no more often than the sampler
# asks it already.
#
# The extract, catalogue/releases.jsonl, holds one line per release: app id,
# version, whether it is a nightly, release date and download URL, sorted, so
# that two extracts compare line by line. It mirrors the current catalogue; a
# removed app or version leaves it.
#
# A stable release whose app id and version were not in the previous extract is
# new. The new ones go out as repository_dispatch events of the type measure,
# at most 256 per event, the most jobs one matrix holds. A nightly is not sent:
# it is replaced under the same version. The first extract sends nothing, since
# every version would count as new.
#
# A version that was in the catalogue before it could be measured is never new:
# one from a release host gh-stats learned to handle later, or one whose
# measurement was lost. So every run also sends the newest stable version of
# each app, and that of each of the MEASURE_LINES release lines before its
# newest, as gh-nc-appslist lists them, when no complete run in the data branch
# names its repository and version: a run is complete while it holds every
# result its summary.json lists and none of the findings STALE_FINDINGS names,
# the findings an analyser no longer reports. A version with an incomplete run
# is sent as well, whether gh-nc-appslist lists it or not. A version the
# measurement already gave up on, listed in its open issue, is not sent again,
# nor one whose check a request removed, and while a measurement runs none is
# sent, since its versions have no result yet.
#
# The same holds for the apps the server ships, each as a server release ships
# it: shipped.json names the repository and directory of every app in each
# server archive gh-nc-shipped reads, and the app is sent with the newest
# release of its major when no complete run of that release names them, and
# with the daily archive of master when no complete run of its current build
# does. An older release is measured on request only, as is an app the release
# enables always, which is part of the server. The shipped.json read is the one
# the previous run kept, so the apps of a new server release, or of a new build
# of master, are sent by the run after the one that found it.
#
# The data branch keeps no history. Every write replaces it with a single
# commit of the new tree, after gh-stats-data-prune thinned the measurement
# results as gh-stats-measure.yml describes, so what was removed leaves the repository
# too. Dispatched by hand, the workflow also thins the results without a new
# catalogue.
#
# Last, gh-nc-shipped lists the apps the server ships, from the archive of
# every release of its maintained majors, of the newest pre-release of a major
# without a release yet, and of master, and keeps them as shipped.json in the
# release catalogue. A release already read is taken over
# from the shipped.json fetched at the start, master while its ETag is
# unchanged, so a run without a new server release reads none but the older
# releases not read yet, a few each run. When the ETag of master changed, a new
# daily build, the workflow dispatches gh-stats-unlisted.yml, so the apps that
# are neither in the catalogue nor shipped are listed once a day.

name: Extract the catalogue

on:
  workflow_dispatch:

permissions:
  # Pushes to the data branch and creates the repository_dispatch events.
  contents: write
  # Sees whether a measurement runs and starts the listing of the unlisted
  # apps.
  actions: write
  # Reads the versions the measurement gave up on.
  issues: read

# No two extracts run at once. A pending run that a newer one replaces loses
# nothing: each run compares the latest catalogue with the extract committed
# last.
concurrency:
  group: catalogue
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  CATALOGUE_TAG: catalogue
  DATA_BRANCH: data
  EXTRACT: catalogue/releases.jsonl
  EVENT_TYPE: measure
  EVENT_VERSIONS: 256
  # The issue in which gh-stats-measure.yml lists the versions it gave up on.
  ISSUE_TITLE: App versions without a result
  ISSUE_LABEL: appsdiag
  # Release lines before the newest that are measured as well, 0 to 4; unset
  # means 1. With MEASURE_PRUNE_LINES true, the results of lines beyond them
  # are removed.
  MEASURE_LINES: ${{ vars.MEASURE_LINES }}
  MEASURE_PRUNE_LINES: ${{ vars.MEASURE_PRUNE_LINES }}
  # Findings an analyser no longer reports, as <tool>:<finding id> separated
  # by spaces, for example bundle-report:split-not-effective. A run that still
  # carries one is measured again, so the site stops showing it.
  STALE_FINDINGS: ${{ vars.STALE_FINDINGS }}
  # The lists gh-stats-request.yml keeps, as gh-stats-data-prune --keep reads them.
  PINNED: requests/pinned.txt
  REMOVED: requests/removed.txt

jobs:
  extract:
    name: extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the catalogue
        run: |
          state="$RUNNER_TEMP/catalogue"
          mkdir -p "$state"
          echo "STATE=$state" >> "$GITHUB_ENV"
          gh release download "$CATALOGUE_TAG" -p apps.json -D "$state"

      - name: Fetch the shipped apps
        run: |
          gh release download "$CATALOGUE_TAG" -p shipped.json -D "$STATE" \
            || echo "::warning::No shipped apps yet, reading every archive"

      - name: Read the settings
        run: |
          lines="${MEASURE_LINES:-1}"
          if ! [[ "$lines" =~ ^[0-4]$ ]]; then
            echo "::error::MEASURE_LINES is $lines, it takes 0 to 4"
            exit 1
          fi
          for stale in $STALE_FINDINGS; do
            if ! [[ "$stale" =~ ^[a-z0-9-]+:[a-z0-9-]+$ ]]; then
              echo "::error::STALE_FINDINGS holds $stale, it takes <tool>:<finding id>"
              exit 1
            fi
          done
          prune=--in-place
          [ "$MEASURE_PRUNE_LINES" != true ] || prune+=" --lines $lines"
          {
            echo "LINES=$lines"
            echo "PRUNE=$prune"
          } >> "$GITHUB_ENV"

      - name: Check out the data branch
        run: |
          data="$RUNNER_TEMP/data"
          echo "DATA=$data" >> "$GITHUB_ENV"
          url="https://github.com/$GH_REPO.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" >/dev/null; then
            git clone -q --depth 1 --branch "$DATA_BRANCH" "$url" "$data"
          else
            # The first writer starts the branch without the history of main.
            git init -q -b "$DATA_BRANCH" "$data"
            git -C "$data" remote add origin "$url"
          fi
          git -C "$data" config user.name 'github-actions[bot]'
          git -C "$data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The repository is public, so only the push needs the token, sent
          # the way actions/checkout sends it.
          git -C "$data" config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

      - name: Write the extract
        run: |
          out="$DATA/$EXTRACT"
          if [ -r "$out" ]; then
            cp "$out" "$STATE/releases.before"
          fi
          mkdir -p "${out%/*}"
          jq -c '.[] | .id as $id | .releases[]
                 | {id: $id, version, nightly: .isNightly, created, download}' "$STATE/apps.json" \
            | LC_ALL=C sort > "$out"
          # Kept for a write that starts over from a newer branch.
          cp "$out" "$STATE/releases.after"

      - name: Find the new versions
        run: |
          keys() { jq -r 'select(.nightly | not) | "\(.id) \(.version)"' "$1" | LC_ALL=C sort -u; }
          if [ ! -r "$STATE/releases.before" ]; then
            echo "::notice::First extract, no versions are sent"
            : > "$STATE/new"
            message='catalogue: first extract'
          else
            LC_ALL=C comm -13 <(keys "$STATE/releases.before") <(keys "$DATA/$EXTRACT") > "$STATE/new"
            message="catalogue: $(wc -l < "$STATE/new") new versions"
          fi
          {
            echo "NEW=$(wc -l < "$STATE/new")"
            echo "MESSAGE=$message"
          } >> "$GITHUB_ENV"

      - name: Find the versions without a result
        env:
          APPSTORE_SOURCE: appdata
          APPSTORE_TARGETS: bin/gh-nc-appstore-targets
        run: |
          : > "$STATE/unmeasured"
          busy="$(gh run list -w gh-stats-measure.yml -L 100 --json status --jq 'map(select(.status != "completed")) | length')"
          if [ "$busy" -gt 0 ]; then
            echo "::notice::A measurement runs, the versions without a result wait for the next run"
            echo "UNMEASURED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          export APPSTORE_APPDATA_FILE="$STATE/apps.json"
          # "[<host>/]<owner>/<repo> <version>" in lower case, as gh-nc-appslist
          # names a version and gh-nc-appsdiag is asked for it, and for a shipped
          # app "-s <server release> [<host>/]<owner>/<repo>[:<directory>]".
          {
            # Every result, whatever its status: gh-stats-measure.yml repeats a run that
            # says nothing about the app on its own. A run counts only while it
            # holds every file its summary.json lists, as is or as <name>.gz;
            # one that lost a report, as the large ones gh-stats-data-prune
            # once removed, is measured again, so all its checks show. So is
            # one that carries a stale finding, which only a new run of the
            # analyser removes. That holds for any version, also one
            # gh-nc-appslist does not list. A run of master counts only from
            # the build of the daily archive shipped.json names on, so each new
            # build is measured again; the build starts with its time in UTC,
            # so a later one sorts after it.
            : > "$STATE/incomplete"
            master=""
            [ ! -s "$STATE/shipped.json" ] \
              || master="$(jq -r 'first(.releases[] | select(.ref == "master") | .build // empty) // ""' "$STATE/shipped.json")"
            if [ -d "$DATA/apps" ]; then
              find "$DATA/apps" -name summary.json -exec jq -r --arg master "$master" '
                select(.server != "master" or $master == "" or (.server_build // "") >= $master)
                | [ (if .server then "-s " + .server + " " else "" end)
                  + (if (.repo_host // "github.com") == "github.com" then "" else .repo_host + "/" end)
                  + .owner + "/" + .repo
                  + (if .server then (if .subdir then ":" + .subdir else "" end)
                     else " " + (.requested_version // .version // "") end),
                  (input_filename | rtrimstr("/summary.json")), (.files // [])[] ] | join("\t")' {} + \
                | while IFS=$'\t' read -r -a run; do
                    for file in "${run[@]:2}"; do
                      if ! [ -e "${run[1]}/$file" ] && ! [ -e "${run[1]}/$file.gz" ]; then
                        printf '%s\n' "${run[0]}" >> "$STATE/incomplete"
                        continue 2
                      fi
                    done
                    for stale in $STALE_FINDINGS; do
                      report="${run[1]}/${stale%%:*}.json"
                      if { cat "$report" 2>/dev/null || gzip -dc "$report.gz" 2>/dev/null; } \
                        | jq -n -e --arg id "${stale#*:}" '[inputs | .findings[]?.id] | any(. == $id)' >/dev/null; then
                        printf '%s\n' "${run[0]}" >> "$STATE/incomplete"
                        continue 2
                      fi
                    done
                    printf '%s\n' "${run[0]}"
                  done
            fi
            number="$(gh issue list --state open --label "$ISSUE_LABEL" --json number,title \
              | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t))[0].number // empty')"
            if [ -n "$number" ]; then
              gh issue view "$number" --json body,comments --jq '.body, .comments[].body' \
                | sed -n 's/^| `\([^`]*\)` |.*/\1/p'
            fi
            # The versions whose check a request removed.
            [ ! -f "$DATA/$REMOVED" ] || sed 's/#.*//; /^[[:space:]]*$/d' "$DATA/$REMOVED"
            # The new versions, which this run sends anyway.
            if [ -s "$STATE/new" ]; then
              bin/gh-nc-appslist -v "$STATE/new" -o - | sed '/^#/d'
            fi
          } | tr '[:upper:]' '[:lower:]' | LC_ALL=C sort -u > "$STATE/known"
          {
            bin/gh-nc-appslist -L "$LINES" -o - | sed '/^#/d'
            [ ! -s "$STATE/shipped.json" ] || jq -r '.releases[] | select(.latest) | .ref as $ref
              | .apps[] | select(.enabled != "always") | "-s \($ref) \(.repo)" + (if (.path // "") != "" then ":" + .path else "" end)' "$STATE/shipped.json"
            cat "$STATE/incomplete"
          } \
            | awk 'FILENAME == ARGV[1] { known[$0]; next } { k = tolower($0) } !(k in known) && !(k in sent) { sent[k]; print }' \
              "$STATE/known" - \
            > "$STATE/unmeasured"
          echo "UNMEASURED=$(wc -l < "$STATE/unmeasured")" >> "$GITHUB_ENV"

      # The measurement writes the branch outside this group. The push goes
      # through only while the branch is still the commit this write started
      # from; otherwise the measurement got ahead, and this write starts over
      # from the branch it left. Its paths are apart from the extract, so the
      # versions found above stay valid.
      - name: Commit the extract
        run: |
          for try in 1 2 3 4 5; do
            if [ "$try" -gt 1 ]; then
              sleep $((try * 10))
              git -C "$DATA" fetch -q --depth 1 origin "$DATA_BRANCH"
              git -C "$DATA" reset -q --hard FETCH_HEAD
              git -C "$DATA" clean -q -f -d
              mkdir -p "$DATA/${EXTRACT%/*}"
              cp "$STATE/releases.after" "$DATA/$EXTRACT"
            fi
            base="$(git -C "$DATA" rev-parse -q --verify HEAD || true)"
            keep=()
            [ ! -f "$DATA/$PINNED" ] || keep=(--keep "$DATA/$PINNED")
            # shellcheck disable=SC2086 # PRUNE holds the options
            [ ! -d "$DATA/apps" ] || bin/gh-stats-data-prune $PRUNE "${keep[@]}" "$DATA/apps"
            git -C "$DATA" add -A
            if git -C "$DATA" diff --cached --quiet; then
              echo "The data branch is unchanged"
              exit 0
            fi
            commit="$(git -C "$DATA" commit-tree "$(git -C "$DATA" write-tree)" -m "$MESSAGE")"
            git -C "$DATA" push -q --force-with-lease="refs/heads/$DATA_BRANCH:$base" \
              origin "$commit:refs/heads/$DATA_BRANCH" && exit 0
          done
          exit 1

      # Only after the push: a version sent before its extract is committed
      # would be sent again by the next run if the push failed.
      - name: Send the new versions to the measurement
        if: env.NEW != '0'
        run: |
          jq -R -n -c --arg type "$EVENT_TYPE" --argjson n "$EVENT_VERSIONS" '
            [inputs | split(" ") | {id: .[0], version: .[1]}]
            | range(0; length; $n) as $i
            | {event_type: $type, client_payload: {versions: .[$i:$i + $n]}}' "$STATE/new" \
            | while IFS= read -r event; do
                gh api --method POST "repos/$GH_REPO/dispatches" --input - <<<"$event"
              done
          echo "::notice::Sent $NEW new versions"

      # In one event: gh-stats-measure.yml passes on what one run cannot hold, so the
      # runs follow one another.
      - name: Send the versions without a result to the measurement
        if: env.UNMEASURED != '0'
        run: |
          jq -R -n -c --arg type "$EVENT_TYPE" \
            '{event_type: $type, client_payload: {apps: [inputs | select(length > 0)]}}' "$STATE/unmeasured" \
            | gh api --method POST "repos/$GH_REPO/dispatches" --input -
          echo "::notice::Sent $UNMEASURED versions without a result"

      - name: Keep the shipped apps
        run: |
          master() { jq -r 'first(.releases[]? | select(.ref == "master") | .etag) // ""' "$1" 2>/dev/null || true; }
          cp "$STATE/shipped.json" "$STATE/shipped.json.before" 2>/dev/null || true
          SHIPPED_FILE="$STATE/shipped.json" bin/gh-nc-shipped
          cmp -s "$STATE/shipped.json" "$STATE/shipped.json.before" \
            || gh release upload "$CATALOGUE_TAG" "$STATE/shipped.json" --clobber
          [ "$(master "$STATE/shipped.json")" = "$(master "$STATE/shipped.json.before")" ] \
            || echo "MASTER_BUILD=1" >> "$GITHUB_ENV"

      # Only after the upload, so the listing leaves out the apps of the new
      # build.
      - name: List the unlisted apps
        if: env.MASTER_BUILD == '1'
        run: gh workflow run gh-stats-unlisted.yml --ref "$GITHUB_REF_NAME"
