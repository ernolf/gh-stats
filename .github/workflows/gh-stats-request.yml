# SPDX-License-Identifier: MIT
#
# Acts on the issues the buttons of an app page open. The site is static, so a
# button can only prefill a new issue:
#
#   Measure <app-id> <version>                sends the version to gh-stats-measure.yml
#                                             and pins it
#   Remove the check of <app-id> <version>    removes its results from the data
#                                             branch and lifts its pin
#   Measure <app-id> as Nextcloud <release> ships it
#   Remove the check of <app-id> as Nextcloud <release> ships it
#                                             the same for a shipped app, as the
#                                             server release, or master, ships it
#   Remove <host>/<owner>/<repo> from the database
#                                             removes a repository the sampler
#                                             counts as unreachable from the
#                                             sampler database
#
# Anyone can open such an issue, so it is acted on only for a user with the
# permission write, maintain or admin on this repository: right away when the
# author has it, else once such a user adds the label approved, which runs this
# workflow again with that user as the sender. The permission of the sender is
# asked every time; the API answers maintain as write and triage as read.
# Closing the issue rejects it.
#
# The title is read as the event carries it, reaches the script through env
# only and must match a strict pattern. An issue whose title does not, such as
# a work issue that starts with one of these words, is left as it is: no label,
# no comment, no close. The version must be one the catalogue
# ships as a stable release, as gh-nc-appslist lists it, which also names the
# repository that is measured. An app the catalogue does not hold must be one
# the unlisted.json of the catalogue lists without a release tarball, with the
# version of one of the tags it keeps, read from the first digit on; gh-stats
# then builds the app from that tag. A shipped app must be one the shipped.json of the
# catalogue lists for that server release, which names its repository and
# directory. A server release is also a pre-release, 36.0.0rc1, matched without
# regard to case.
#
# The data branch holds both lists, one "[<host>/]<owner>/<repo>[:<directory>] <version>"
# per line in lower case, with the directory only for an unlisted app below the
# root of its repository: a pinned version keeps all its results whatever
# MEASURE_LINES says, and a removed one is not sent again by gh-stats-catalogue.yml as a
# version without a result, until a new request measures it. The newest stable
# version of a repository always keeps its result, as does the newest tag of an
# unlisted app, and so does a shipped app as
# the newest release of its server major, the newest pre-release of a major
# without a release, or master ships it, unless the release enables it always.
# A shipped app has the line "-s v<release> <owner>/<repo>[:<directory>]", for
# master "-s master ...".
#
# A removed repository leaves every table of the sampler database but keeps its
# row in repos, marked as removed, so the sampler neither asks it again nor adds
# it back from the catalogue. The removal runs in the concurrency group of the
# sampler, so no sampler run restores the database before the removal has
# uploaded it. A run that queues in that group while the removal still waits
# for a sampler run replaces it; adding the label approved again repeats it.

name: Act on a measurement request

on:
  issues:
    types: [opened, labeled]

permissions:
  # Writes the data branch and the database asset, and creates the
  # repository_dispatch event.
  contents: write
  # Comments on, labels and closes the request.
  issues: write
  # Rebuilds the site after a removal.
  actions: write

concurrency:
  group: request-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  CATALOGUE_TAG: catalogue
  DATA_BRANCH: data
  EVENT_TYPE: measure
  ISSUE_LABEL: appsdiag
  SAMPLER_LABEL: sampler
  APPROVED_LABEL: approved
  SAMPLER_DB_TAG: sampler-db
  SAMPLER_DB_ASSET: downloads.sqlite.zst
  PINNED: requests/pinned.txt
  REMOVED: requests/removed.txt
  NUMBER: ${{ github.event.issue.number }}

jobs:
  # A request that waits for approval is no failure, so the permission is its
  # own job and the request job is skipped without it.
  permission:
    name: permission
    if: >-
      github.event.issue.state == 'open'
      && (github.event.action == 'opened' || github.event.label.name == 'approved')
      && (startsWith(github.event.issue.title, 'Measure ') || startsWith(github.event.issue.title, 'Remove the check of ')
        || (startsWith(github.event.issue.title, 'Remove ') && endsWith(github.event.issue.title, ' from the database')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      kind: ${{ steps.title.outputs.kind }}
      app: ${{ steps.title.outputs.app }}
      version: ${{ steps.title.outputs.version }}
      server: ${{ steps.title.outputs.server }}
      host: ${{ steps.title.outputs.host }}
      owner: ${{ steps.title.outputs.owner }}
      repo: ${{ steps.title.outputs.repo }}
      allowed: ${{ steps.sender.outputs.allowed }}
    steps:
      # The expressions of if: have no regular expressions, so the condition of
      # the job only narrows the titles down and the exact form is matched here,
      # before anything is done to the issue.
      - name: Match the title
        id: title
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" =~ ^Measure\ ([a-z0-9_]+)\ as\ Nextcloud\ ([0-9]+\.[0-9]+\.[0-9]+([A-Za-z]+[0-9]*)?|master)\ ships\ it$ ]]; then
            printf '%s\n' kind=measure "app=${BASH_REMATCH[1]}" "server=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" =~ ^Remove\ the\ check\ of\ ([a-z0-9_]+)\ as\ Nextcloud\ ([0-9]+\.[0-9]+\.[0-9]+([A-Za-z]+[0-9]*)?|master)\ ships\ it$ ]]; then
            printf '%s\n' kind=remove "app=${BASH_REMATCH[1]}" "server=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" =~ ^Measure\ ([a-z0-9_]+)\ ([0-9]+(\.[0-9]+)*)$ ]]; then
            printf '%s\n' kind=measure "app=${BASH_REMATCH[1]}" "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" =~ ^Remove\ the\ check\ of\ ([a-z0-9_]+)\ ([0-9]+(\.[0-9]+)*)$ ]]; then
            printf '%s\n' kind=remove "app=${BASH_REMATCH[1]}" "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TITLE" =~ ^Remove\ ([a-z0-9-]+(\.[a-z0-9-]+)+)/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)\ from\ the\ database$ ]]; then
            printf '%s\n' kind=database "host=${BASH_REMATCH[1]}" "owner=${BASH_REMATCH[3]}" "repo=${BASH_REMATCH[4]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The title has the form of no request, the issue stays as it is"
          fi

      # A user who is no collaborator may get 404 instead of none.
      - name: Check the permission of the sender
        id: sender
        if: steps.title.outputs.kind != ''
        env:
          SENDER: ${{ github.event.sender.login }}
          ACTION: ${{ github.event.action }}
          KIND: ${{ steps.title.outputs.kind }}
        run: |
          if [ "$ACTION" = opened ]; then
            label="$ISSUE_LABEL"
            [ "$KIND" != database ] || label="$SAMPLER_LABEL"
            gh issue edit "$NUMBER" --add-label "$label"
          fi
          permission="$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq .permission 2>/dev/null || echo none)"
          case "$permission" in
            admin|write)
              echo "allowed=1" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if [ "$ACTION" = opened ]; then
            gh issue comment "$NUMBER" --body "This request waits for approval: a user with the permission write, maintain or admin approves it by adding the label \`$APPROVED_LABEL\`. Closing the issue rejects it."
          else
            gh issue comment "$NUMBER" --body "@$SENDER the label \`$APPROVED_LABEL\` approves a request only when a user with the permission write, maintain or admin adds it."
          fi
          echo "::notice::$SENDER has the permission $permission, the request waits"

  request:
    name: request
    needs: permission
    if: needs.permission.outputs.allowed == '1' && needs.permission.outputs.kind != 'database'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ needs.permission.outputs.kind }}
      APP: ${{ needs.permission.outputs.app }}
      VERSION: ${{ needs.permission.outputs.version }}
      SERVER: ${{ needs.permission.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the version in the catalogue
        env:
          APPSTORE_SOURCE: appdata
          APPSTORE_TARGETS: bin/gh-nc-appstore-targets
        run: |
          state="$RUNNER_TEMP/request"
          mkdir -p "$state"
          echo "STATE=$state" >> "$GITHUB_ENV"
          if [ -n "$SERVER" ]; then
            echo "WHICH=as Nextcloud $SERVER ships it" >> "$GITHUB_ENV"
            ref="v$SERVER"
            [ "$SERVER" != master ] || ref=master
            gh release download "$CATALOGUE_TAG" -p shipped.json -D "$state"
            jq -c --arg ref "$ref" --arg id "$APP" \
              '.releases[] | select((.ref | ascii_downcase) == ($ref | ascii_downcase)) | .latest as $latest | .apps[] | select(.id == $id) | . + {latest: $latest}' \
              "$state/shipped.json" > "$state/app.json"
            if [ ! -s "$state/app.json" ]; then
              gh issue close "$NUMBER" --reason "not planned" --comment "The catalogue lists no app \`$APP\` in the archive of Nextcloud $SERVER."
              exit 1
            fi
            jq -r --arg ref "$ref" '"-s \($ref) \(.repo)" + (if .path != "" then ":" + .path else "" end)' "$state/app.json" \
              | tr '[:upper:]' '[:lower:]' > "$state/lines"
            # The directory of its runs below apps/ of the data branch, as
            # gh-nc-appsdiag names it: an app below the root of its repository
            # has its id between the repository and the server release.
            jq -r '.repo + (if .path != "" then "/" + .id else "" end)' "$state/app.json" \
              | tr '[:upper:]' '[:lower:]' > "$state/key"
            if [ "$KIND" = remove ] && jq -e '.latest and .enabled != "always"' "$state/app.json" >/dev/null; then
              if [ "$SERVER" = master ]; then
                gh issue close "$NUMBER" --reason "not planned" --comment "Each build of master is measured, the check of \`$APP\` as it ships it stays."
              else
                gh issue close "$NUMBER" --reason "not planned" --comment "$SERVER is the newest release of Nextcloud ${SERVER%%.*}, the check of \`$APP\` as it ships it stays."
              fi
              exit 1
            fi
            exit 0
          fi
          echo "WHICH=$VERSION" >> "$GITHUB_ENV"
          gh release download "$CATALOGUE_TAG" -p apps.json -D "$state"
          export APPSTORE_APPDATA_FILE="$state/apps.json"
          printf '%s %s\n' "$APP" "$VERSION" > "$state/versions"
          bin/gh-nc-appslist -v "$state/versions" -o - | sed '/^#/d' | tr '[:upper:]' '[:lower:]' \
            | LC_ALL=C sort -u > "$state/lines"
          if [ ! -s "$state/lines" ]; then
            # An unlisted app is measured from its tag, as long as no release
            # carries a tarball to measure instead.
            gh release download "$CATALOGUE_TAG" -p unlisted.json -D "$state" 2>/dev/null || :
            [ ! -s "$state/unlisted.json" ] || jq -r --arg id "$APP" --arg v "$VERSION" '
              .apps[] | select((.id | ascii_downcase) == $id and .tarball == false)
              | [.tags[]? | sub("^[^0-9]*"; "") | select(. != "")] as $vs
              | select(any($vs[]; . == $v))
              | (if .host == "github.com" then "" else .host + "/" end) + .repo
                + (if .path != "" then ":" + .path else "" end) + " " + $v
                + (if $vs[0] == $v then " newest" else "" end)' "$state/unlisted.json" \
              | tr '[:upper:]' '[:lower:]' > "$state/unlisted"
            if [ ! -s "$state/unlisted" ]; then
              gh issue close "$NUMBER" --reason "not planned" --comment "The catalogue ships no stable release $VERSION of \`$APP\` from a repository gh-stats measures, and lists no app \`$APP\` outside the App Store with a tag of $VERSION and no release tarball."
              exit 1
            fi
            if [ "$KIND" = remove ] && grep -q ' newest$' "$state/unlisted"; then
              gh issue close "$NUMBER" --reason "not planned" --comment "$VERSION is the newest tag of \`$APP\`, its check stays."
              exit 1
            fi
            cut -d ' ' -f 1,2 "$state/unlisted" > "$state/lines"
            exit 0
          fi
          if [ "$KIND" = remove ]; then
            bin/gh-nc-appslist -o - | sed '/^#/d' | tr '[:upper:]' '[:lower:]' | LC_ALL=C sort -u > "$state/newest"
            if [ -n "$(LC_ALL=C comm -12 "$state/lines" "$state/newest")" ]; then
              gh issue close "$NUMBER" --reason "not planned" --comment "$VERSION is the newest stable version of \`$APP\`, its check stays."
              exit 1
            fi
          fi

      - name: Check out the data branch
        run: |
          data="$RUNNER_TEMP/data"
          echo "DATA=$data" >> "$GITHUB_ENV"
          url="https://github.com/$GH_REPO.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" >/dev/null; then
            git clone -q --depth 1 --branch "$DATA_BRANCH" "$url" "$data"
          else
            # The first writer starts the branch without the history of main.
            git init -q -b "$DATA_BRANCH" "$data"
            git -C "$data" remote add origin "$url"
          fi
          git -C "$data" config user.name 'github-actions[bot]'
          git -C "$data" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The repository is public, so only the push needs the token, sent
          # the way actions/checkout sends it.
          git -C "$data" config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

      # The push goes through only while the branch is still the commit this
      # write started from; otherwise another write got ahead, and this one
      # starts over from the branch it left.
      - name: Write the request to the data branch
        run: |
          # Adds the lines of the request to one list and takes them off the other.
          lists() {
            mkdir -p "$DATA/${PINNED%/*}" "$DATA/${REMOVED%/*}"
            touch "$DATA/$1" "$DATA/$2"
            LC_ALL=C sort -u -o "$DATA/$1" "$DATA/$1" "$STATE/lines"
            LC_ALL=C comm -23 <(LC_ALL=C sort -u "$DATA/$2") "$STATE/lines" > "$STATE/rest"
            cp "$STATE/rest" "$DATA/$2"
          }
          for try in 1 2 3 4 5; do
            if [ "$try" -gt 1 ]; then
              sleep $((try * 10))
              git -C "$DATA" fetch -q --depth 1 origin "$DATA_BRANCH"
              git -C "$DATA" reset -q --hard FETCH_HEAD
              git -C "$DATA" clean -q -f -d
            fi
            base="$(git -C "$DATA" rev-parse -q --verify HEAD || true)"
            dirs=0
            if [ "$KIND" = measure ]; then
              lists "$PINNED" "$REMOVED"
              message="request: measure $APP $WHICH"
            else
              lists "$REMOVED" "$PINNED"
              message="request: remove the check of $APP $WHICH"
              # The version directories of the repository, and of its apps below
              # the root, which lie one directory deeper. A shipped app has only
              # its own: the server repository holds many apps. So has an
              # unlisted app below the root, whose line names its directory.
              if [ -n "$SERVER" ]; then
                key="$(cat "$STATE/key")"
                while IFS= read -r -d '' dir; do
                  app="${dir%/*}"
                  app="${app#"$DATA/apps/"}"
                  if [ "${app,,}" = "$key" ]; then
                    rm -rf -- "$dir"
                    dirs=$((dirs + 1))
                  fi
                done < <(find "$DATA/apps" -mindepth 3 -type d -iname "server-$SERVER" -print0 2>/dev/null)
              else
                while read -r repo version; do
                  while IFS= read -r -d '' dir; do
                    app="${dir%/*}"
                    app="${app#"$DATA/apps/"}"
                    app="${app,,}"
                    if { [[ "$repo" == *:* ]] && [ "$app" = "${repo%%:*}/$APP" ]; } \
                      || { [[ "$repo" != *:* ]] && { [ "$app" = "$repo" ] || [ "${app%/*}" = "$repo" ]; }; }; then
                      rm -rf -- "$dir"
                      dirs=$((dirs + 1))
                    fi
                  done < <(find "$DATA/apps" -mindepth 3 -type d -name "$version" -print0 2>/dev/null)
                done < "$STATE/lines"
              fi
              [ ! -d "$DATA/apps" ] || find "$DATA/apps" -mindepth 1 -type d -empty -delete
            fi
            echo "REMOVED_DIRS=$dirs" >> "$GITHUB_ENV"
            git -C "$DATA" add -A
            if git -C "$DATA" diff --cached --quiet; then
              echo "The data branch is unchanged"
              exit 0
            fi
            commit="$(git -C "$DATA" commit-tree "$(git -C "$DATA" write-tree)" -m "$message")"
            git -C "$DATA" push -q --force-with-lease="refs/heads/$DATA_BRANCH:$base" \
              origin "$commit:refs/heads/$DATA_BRANCH" && exit 0
          done
          exit 1

      # gh-stats-measure.yml comments on the issue with a link to its run and closes it.
      - name: Send the version to the measurement
        if: env.KIND == 'measure'
        run: |
          jq -R -n -c --arg type "$EVENT_TYPE" --argjson issue "$NUMBER" \
            '{event_type: $type, client_payload: {apps: [inputs | select(length > 0)], issue: $issue}}' "$STATE/lines" \
            | gh api --method POST "repos/$GH_REPO/dispatches" --input -
          echo "::notice::Sent $APP $WHICH to the measurement"

      - name: Report the removal
        if: env.KIND == 'remove'
        run: |
          gh workflow run gh-stats-site.yml --ref "$GITHUB_REF_NAME"
          gh issue close "$NUMBER" --reason completed --comment "Removed the check of \`$APP\` $WHICH, $REMOVED_DIRS version directories, from the data branch. It is no longer measured again unless a new request asks for it; the site shows the change after its build in $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/gh-stats-site.yml."

  remove:
    name: remove
    needs: permission
    if: needs.permission.outputs.allowed == '1' && needs.permission.outputs.kind == 'database'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sampler
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HOST: ${{ needs.permission.outputs.host }}
      OWNER: ${{ needs.permission.outputs.owner }}
      REPO: ${{ needs.permission.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the database
        run: |
          state="$RUNNER_TEMP/remove"
          mkdir -p "$state"
          echo "STATE=$state" >> "$GITHUB_ENV"
          bin/gh-stats-db restore "$state/downloads.sqlite"

      # The hosts resolve names without case, so every spelling of the
      # repository goes. The title pattern leaves no quote in the names. The
      # ETags go with the rows: one would answer 304 for data that is gone.
      - name: Remove the repository
        run: |
          db="$STATE/downloads.sqlite"
          w="host = '$HOST' AND lower(owner) = lower('$OWNER') AND lower(repo) = lower('$REPO')"
          if [ "$(sqlite3 "$db" "SELECT count(*) FROM repos WHERE $w AND unreachable = 1 AND removed IS NULL")" = 0 ]; then
            gh issue close "$NUMBER" --reason "not planned" --comment "The database holds no repository \`$HOST/$OWNER/$REPO\` that the sampler counts as unreachable."
            exit 1
          fi
          if [ "$HOST" = github.com ]; then path="repos/$OWNER/$REPO"; else path="https://$HOST/api/v1/repos/$OWNER/$REPO"; fi
          path="${path,,}"
          counts="$(sqlite3 -bail "$db" <<SQL
          BEGIN;
          SELECT (SELECT count(*) FROM samples WHERE $w) || ' ' || (SELECT count(*) FROM releases WHERE $w) || ' ' || (SELECT count(*) FROM repo_stats WHERE $w);
          DELETE FROM samples WHERE $w;
          DELETE FROM releases WHERE $w;
          DELETE FROM repo_stats WHERE $w;
          DELETE FROM etags WHERE lower(path) = '$path' OR substr(lower(path), 1, length('$path') + 1) = '$path/';
          UPDATE repos SET removed = $(date -u +%s) WHERE $w;
          COMMIT;
          VACUUM;
          SQL
          )"
          read -r samples releases stats <<<"$counts"
          echo "REMOVED_ROWS=$samples samples of its download counters, $releases releases and $stats snapshots of its stars, forks and watchers" >> "$GITHUB_ENV"

      # The tables the removal deletes from are the ones that may hold fewer rows.
      - name: Upload the database
        run: bin/gh-stats-db store -r samples -r releases -r repo_stats -r etags "$STATE/downloads.sqlite"

      - name: Report the removal
        run: |
          gh workflow run gh-stats-site.yml --ref "$GITHUB_REF_NAME"
          gh issue close "$NUMBER" --reason completed --comment "Removed \`$HOST/$OWNER/$REPO\` from the database, $REMOVED_ROWS. The sampler does not ask it again; the site shows the change after its build in $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/gh-stats-site.yml."
