#
# Sample of the release download counters every 30 minutes, run on GitHub's
# runners instead of a host. The runner keeps nothing between runs, so both
# inputs that have to survive live as assets of two releases of this repository:
#
#   catalogue   apps.json and appapi_apps.json, the two files of the App Store
#               catalogue, the second with the AppAPI apps (ExApps), each with
#               the ETag of its last answer in a .etag beside it, so an
#               unchanged file costs one conditional request, and
#               categories.json, the names of the App Store categories, which
#               only the site reads; gh-stats-catalogue.yml keeps sources.json
#               there, from which the repositories the apps are developed in
#               are sampled as well, and shipped.json, the server releases,
#               from which gh-nc-platforms takes the versions whose platform
#               lists it reads; platforms.json, what it read from those lists
#   sampler-db  downloads.sqlite.zst, the sampler database, and tools.json,
#               the versions of the tools the last run sampled with, which
#               the site lists under "Built with"
#
# bin/gh-stats-db restores and stores the database, here and in
# gh-stats-request.yml and gh-stats-site.yml. It stores only an intact database
# that has lost nothing the run did not thin, writes it to the release
# sampler-db-backup before sampler-db, and keeps generations of backups there.
# The database is never started empty: without an intact copy in either release
# the run stops, since a fresh database would replace the whole history. The
# first asset is seeded once from an existing database with gh-stats-prune -o.
#
# apps.json lists, of the releases of an app that declare the same Nextcloud
# range, PHP range and stability, only the highest version. After the fetch
# gh-nc-platforms adds the others from the platform lists of the App Store, each
# marked with "platformOnly", so the asset apps.json holds them as well, while
# apps.json.etag stays the ETag of the answer of the App Store. The lists of the
# end-of-life server versions come from the mirror the Actions variable
# PLATFORM_MIRROR names, asked conditionally for each of them every run; of the
# lists of the other versions a run asks the App Store for one, in turn. Without
# the variable every list takes its turn at the App Store.
#
# The sampler runs with SAMPLER_TOKEN, a personal access token without scopes:
# GITHUB_TOKEN is limited to 1,000 requests per hour and repository, which does
# not cover the App Store targets. That token shares its 5,000 per hour with
# every other sampler of the account; a run asks only conditionally and starts
# only when the remaining budget covers it, so two runs per hour fit. The
# release assets themselves are written with GITHUB_TOKEN.
#
# Every run dispatches gh-stats-catalogue.yml, which extracts apps.json into the data
# branch and sends its new and its never measured versions to the measurement.
# appapi_apps.json takes no part in that: an ExApp is not built, so it is never
# measured.
#
# The workflow has no schedule: its schedule trigger never started a run. An
# external cron dispatches it instead, for example with a /etc/cron.d entry
# whose retry repeats a failed dispatch and whose logger keeps its output:
#
#   17,47 * * * * root retry gh workflow run gh-stats-sampler.yml -R ernolf/gh-stats 2>&1 | /usr/bin/logger -t gh-stats-dispatch

name: Sample download counters

on:
  workflow_dispatch:

permissions:
  contents: write
  # Dispatches the catalogue extract and the site build after their uploads.
  actions: write

# A run that is still going must finish and upload before the next one restores
# the database, otherwise the next one would work on the older copy.
concurrency:
  group: sampler
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  CATALOGUE_TAG: catalogue
  SAMPLER_DB_TAG: sampler-db
  SAMPLER_DB_ASSET: downloads.sqlite.zst
  # The hand-curated targets besides the App Store ones come from the Actions
  # variable SAMPLER_TARGETS: owners or [host/]owner/repo slugs, as in
  # targets.json, separated by spaces or line breaks. Without it, only the App
  # Store targets are sampled. The repositories of the templates and developer
  # tools, UNLISTED_TOOLS as gh-stats-unlisted.yml reads it, are sampled as
  # well, so the site shows the downloads of their releases. The sampler reads
  # both itself, so it names the variable of a target it leaves out.
  SAMPLER_TARGETS: ${{ vars.SAMPLER_TARGETS }}
  UNLISTED_TOOLS: ${{ vars.UNLISTED_TOOLS }}
  # The base URL of a mirror of the platform lists of the end-of-life server
  # versions, <PLATFORM_MIRROR>/<version>/apps.json; without it gh-nc-platforms
  # reads every list from the App Store.
  PLATFORM_MIRROR: ${{ vars.PLATFORM_MIRROR }}

jobs:
  sample:
    name: sample
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the state directory
        run: |
          state="$RUNNER_TEMP/gh-stats"
          mkdir -p "$state/catalogue" "$state/targets.d"
          {
            echo "STATE=$state"
            echo "GH_STATS_DIR=$state"
            echo "GH_STATS_CONFIG=$state/targets.json"
            echo "GH_STATS_TARGETS_DIR=$state/targets.d"
          } >> "$GITHUB_ENV"

      - name: Restore the App Store catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$CATALOGUE_TAG" >/dev/null 2>&1; then
            gh release create "$CATALOGUE_TAG" --prerelease \
              --title "App Store catalogue" \
              --notes "The App Store catalogue with its ETag, kept by the sampler workflow between runs."
          elif ! gh release download "$CATALOGUE_TAG" -p apps.json -p apps.json.etag -p appapi_apps.json -p appapi_apps.json.etag -D "$STATE/catalogue"; then
            # Without a cache the catalogue is fetched in full, which is one request per file.
            echo "::warning::No cached catalogue, fetching it in full"
          fi
          # Apart from the catalogue, so a release without the names yet still
          # restores the two files the targets come from.
          gh release download "$CATALOGUE_TAG" -p categories.json -p categories.json.etag -D "$STATE/catalogue" \
            || echo "::warning::No cached categories, fetching them in full"
          # The development repositories gh-nc-sources confirmed; the targets
          # take them from beside the catalogue.
          gh release download "$CATALOGUE_TAG" -p sources.json -D "$STATE/catalogue" \
            || echo "::warning::No release sources, the development repositories are not sampled"
          # What the run before read from the platform lists, and the server
          # releases, whose newest per major names a list of the App Store.
          gh release download "$CATALOGUE_TAG" -p platforms.json -D "$STATE/catalogue" \
            || echo "::warning::No platform lists read yet, reading every list in full"
          gh release download "$CATALOGUE_TAG" -p shipped.json -D "$STATE/catalogue" \
            || echo "::warning::No server releases, only the lists of the end-of-life versions are read"
          # The catalogue as the run before left it: gh-nc-platforms takes the
          # releases it added from this copy, since a changed apps.json replaces
          # the file, and the upload below tells a change by the other two.
          if [ -r "$STATE/catalogue/apps.json" ]; then
            cp "$STATE/catalogue/apps.json" "$STATE/catalogue/apps.json.before"
            sha256sum < "$STATE/catalogue/apps.json" > "$STATE/apps.json.sum"
          fi
          cp "$STATE/catalogue/platforms.json" "$STATE/platforms.json.before" 2>/dev/null || true
          for f in apps.json appapi_apps.json categories.json; do
            cp "$STATE/catalogue/$f.etag" "$STATE/$f.etag.before" 2>/dev/null || true
          done

      # The first evaluation fetches the catalogue, the second one reads it with
      # the releases gh-nc-platforms added. A run in which the lists cannot be
      # read samples with the catalogue as it is.
      - name: Derive the App Store targets
        run: |
          export APPSTORE_CACHE="$STATE/catalogue/apps.json"
          export APPSTORE_TARGETS_FILE="$GH_STATS_TARGETS_DIR/appstore.json"
          APPSTORE_SOURCE=download bin/gh-nc-appstore-targets
          if bin/gh-nc-platforms; then
            APPSTORE_SOURCE=appdata APPSTORE_APPDATA_FILE="$APPSTORE_CACHE" bin/gh-nc-appstore-targets
          else
            echo "::warning::The platform lists were not read, the catalogue stays without their changes"
          fi

      - name: Keep a changed catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in apps.json appapi_apps.json categories.json; do
            etag="$STATE/catalogue/$f.etag"
            test -r "$etag" || continue
            if cmp -s "$etag" "$STATE/$f.etag.before"; then
              # apps.json changes under an unchanged ETag when a platform list did.
              [ "$f" = apps.json ] || continue
              [ "$(sha256sum < "$STATE/catalogue/$f")" != "$(cat "$STATE/apps.json.sum" 2>/dev/null)" ] || continue
            fi
            gh release upload "$CATALOGUE_TAG" "$STATE/catalogue/$f" "$etag" --clobber
          done
          # After the catalogue it describes. A run that stops in between leaves
          # the older file, by which the next run reads the changed lists again.
          if [ -r "$STATE/catalogue/platforms.json" ] && ! cmp -s "$STATE/catalogue/platforms.json" "$STATE/platforms.json.before"; then
            gh release upload "$CATALOGUE_TAG" "$STATE/catalogue/platforms.json" --clobber
          fi

      # Also with an unchanged catalogue, which may hold versions that were
      # never measured.
      - name: Extract the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-stats-catalogue.yml --ref "$GITHUB_REF_NAME"

      - name: Restore the database
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/gh-stats-db restore "$GH_STATS_DIR/downloads.sqlite"
          gh release download "$SAMPLER_DB_TAG" -p tools.json -O "$STATE/tools.json.before" || true

      - name: Sample
        env:
          GH_TOKEN: ${{ secrets.SAMPLER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The repository secret SAMPLER_TOKEN is not set"
            exit 1
          fi
          bin/gh-release-sampler

      # Also after a sampler run that reported failed requests or left out a
      # target of the wrong form: what it did sample is committed to the
      # database and would otherwise be lost.
      - name: Thin and upload the database
        id: upload
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin/gh-stats-prune --in-place
          bin/gh-stats-db store -t samples -t repo_stats -t runs "$GH_STATS_DIR/downloads.sqlite"

      # Uploaded only when a version changed. The OpenSSL is the one curl is
      # linked against.
      - name: Keep the tool versions
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n \
            --arg gh "$(gh --version | awk 'NR == 1 { print $3 }')" \
            --arg curl "$(curl --version | awk 'NR == 1 { print $2 }')" \
            --arg openssl "$(curl --version | sed -n '1s:.* OpenSSL/\([^ ]*\).*:\1:p')" \
            --arg jq "$(jq --version | sed 's/^jq-//')" \
            --arg sqlite3 "$(sqlite3 --version | awk '{ print $1 }')" \
            --arg zstd "$(zstd -V | sed -n 's/.* v\([0-9.]*\).*/\1/p')" \
            --arg git "$(git --version | awk '{ print $3 }')" \
            '{"GitHub CLI": $gh, curl: $curl, OpenSSL: $openssl, jq: $jq, sqlite3: $sqlite3, zstd: $zstd, git: $git}
             | with_entries(select(.value != ""))' > "$STATE/tools.json"
          cmp -s "$STATE/tools.json" "$STATE/tools.json.before" \
            || gh release upload "$SAMPLER_DB_TAG" "$STATE/tools.json" --clobber

      # Of the events GITHUB_TOKEN causes, only a dispatch starts another workflow.
      - name: Rebuild the site
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-stats-site.yml --ref "$GITHUB_REF_NAME"
