# SPDX-FileCopyrightText: 2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>
# SPDX-License-Identifier: MIT
#
# Builds the site and deploys it to GitHub Pages. The site has no server side:
# the browser loads the site database whole and queries it with sql.js, so the
# deployment carries the pages under site/, the database gh-stats-site-db builds
# from the latest sampler database, catalogue, shipped and unlisted apps, the
# repositories and tags of the releases that are no release asset, the apps
# with an overdue security finding that gh-stats-security.yml keeps in the
# release security, and the measurement results on the data branch, sql.js
# itself, uPlot for the charts, and marked and DOMPurify for the app
# descriptions. Nothing of it is committed.
#
# The sampler workflow dispatches this one after every upload of its database,
# so a new measurement shows on the site with the next upload.
#
# Every build puts the database under a directory of its own, named by the run,
# with the findings of each measurement and the samples of each project, which
# gh-stats-site-db writes beside it and the page fetches when a measurement is
# opened or a chart or a comparison needs a project, and config.json points to
# it: Pages lets browsers cache a file for 10 minutes, and a fixed name could
# then mix a cached config with another database.
# config.json also names the versions of the libraries, and of the tools the
# sampler and the measurement ran with, which the page lists under "Built
# with": the sampler keeps its own as tools.json in the release sampler-db,
# the measurement those of Podman and ncmake as tools.json in the data branch.
#
# A measurement result jq cannot read is left out of the database, so one file
# does not stop the site. The report job names every one left out in an open
# issue assigned to the owner of the repository, comments there when the list
# changes, and closes the issue once a build leaves nothing out.
#
# The libraries are shipped with the site, so visitors load nothing from a
# third-party host. site/package-lock.json names the version of each and the
# integrity the npm registry lists for its tarball; Dependabot keeps it up to
# date, and the build checks every tarball against it.

name: Build the site

on:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest build matters; a queued one is replaced by a newer one, but a
# deployment that has started is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  CATALOGUE_TAG: catalogue
  SAMPLER_DB_TAG: sampler-db
  SAMPLER_DB_ASSET: downloads.sqlite.zst
  SECURITY_TAG: security
  DATA_BRANCH: data
  ISSUE_TITLE: Measurement results the site leaves out
  ISSUE_LABEL: appsdiag

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      unreadable: ${{ steps.db.outputs.unreadable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the library versions
        run: |
          for lib in SQLJS:sql.js UPLOT:uplot MARKED:marked DOMPURIFY:dompurify; do
            jq -r -e --arg var "${lib%%:*}" --arg pkg "node_modules/${lib#*:}" '
              .packages[$pkg] // error("\($pkg) is not in the lock file")
              | "\($var)_VERSION=\(.version)\n\($var)_INTEGRITY=\(.integrity)"' site/package-lock.json >> "$GITHUB_ENV"
          done

      # Only the JSON results and the tool versions are checked out.
      # reuse.json lists every file of a checkout and is by far the largest;
      # the REUSE verdict is the exit code summary.json records. That of a run
      # of nextcloud/server is checked out all the same: the apps of its tree
      # take their result from it.
      - name: Checkout the measurement results
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: data
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools.json
            apps/**/*.json
            apps/**/*.json.gz
            !apps/**/reuse.json
            !apps/**/reuse.json.gz
            apps/nextcloud/server/server-*/*/reuse.json
            apps/nextcloud/server/server-*/*/reuse.json.gz

      - name: Fetch the sampler database and the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$RUNNER_TEMP/gh-stats"
          mkdir -p "$state"
          echo "STATE=$state" >> "$GITHUB_ENV"
          bin/gh-stats-db restore "$state/downloads.sqlite"
          gh release download "$CATALOGUE_TAG" -p apps.json -p appapi_apps.json -D "$state"
          # Without the names the site shows the category ids.
          gh release download "$CATALOGUE_TAG" -p categories.json -D "$state" \
            || echo "::warning::No category names in the catalogue"
          # Without them the Shipped Apps tab stays empty.
          gh release download "$CATALOGUE_TAG" -p shipped.json -D "$state" \
            || echo "::warning::No shipped apps in the catalogue"
          # Without them the Apps tab lists no app outside the App Store.
          gh release download "$CATALOGUE_TAG" -p unlisted.json -D "$state" \
            || echo "::warning::No unlisted apps in the catalogue"
          # Without them the site marks no release as measured from a tag.
          gh release download "$CATALOGUE_TAG" -p sources.json -D "$state" \
            || echo "::warning::No sources of the releases in the catalogue"
          # Without them the site marks no app as having an overdue security
          # finding; before the first check of the findings there is no such list.
          gh release download "$SECURITY_TAG" -p security-overdue.json -D "$state" \
            || echo "::warning::No list of the apps with an overdue security finding"
          gh release download "$SAMPLER_DB_TAG" -p tools.json -D "$state" \
            || echo "::warning::No versions of the sampler tools"

      - name: Build the site database
        id: db
        run: |
          out="$RUNNER_TEMP/_site"
          cp -r site "$out"
          rm "$out/package.json" "$out/package-lock.json"
          db="db/$GITHUB_RUN_ID/gh-stats.sqlite"
          mkdir -p "$out/${db%/*}"
          GH_STATS_DB="$STATE/downloads.sqlite" APPSTORE_CACHE="$STATE/apps.json" \
            bin/gh-stats-site-db -o "$out/$db" -r data/apps -u "$RUNNER_TEMP/unreadable.txt"
          echo "unreadable=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/unreadable.txt")" >> "$GITHUB_OUTPUT"
          sampled="$(cat "$STATE/tools.json" 2>/dev/null || echo '{}')"
          measured="$(cat data/tools.json 2>/dev/null || echo '{}')"
          # ncmake has no release it runs from; its commit stands in.
          jq -n --arg db "$db" --argjson bytes "$(stat -c %s "$out/$db")" \
            --arg results "https://github.com/$GH_REPO/tree/$DATA_BRANCH/apps" \
            --arg issues "https://github.com/$GH_REPO/issues/new" \
            --arg sqljs "$SQLJS_VERSION" --arg uplot "$UPLOT_VERSION" \
            --arg marked "$MARKED_VERSION" --arg dompurify "$DOMPURIFY_VERSION" \
            --argjson sampled "$sampled" --argjson measured "$measured" \
            '{db: $db, bytes: $bytes, results: $results, issues: $issues,
              lib: ({"sql.js": $sqljs, uPlot: $uplot, marked: $marked, DOMPurify: $dompurify}
                    + $sampled + ($measured | if .ncmake then .ncmake |= .[0:7] else . end))}' > "$out/config.json"
          echo "SITE=$out" >> "$GITHUB_ENV"

      - name: Add sql.js
        run: |
          tgz="$RUNNER_TEMP/sql.js.tgz"
          curl -fsSL -o "$tgz" "https://registry.npmjs.org/sql.js/-/sql.js-$SQLJS_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$got" != "$SQLJS_INTEGRITY" ]; then
            echo "::error::sql.js $SQLJS_VERSION does not match its integrity: $got"
            exit 1
          fi
          mkdir -p "$SITE/lib/sql.js"
          tar -xzf "$tgz" -C "$SITE/lib/sql.js" --strip-components=1 \
            package/LICENSE package/dist/sql-wasm.js package/dist/sql-wasm.wasm
          mv "$SITE/lib/sql.js/dist/"* "$SITE/lib/sql.js/"
          rmdir "$SITE/lib/sql.js/dist"

      - name: Add uPlot
        run: |
          tgz="$RUNNER_TEMP/uplot.tgz"
          curl -fsSL -o "$tgz" "https://registry.npmjs.org/uplot/-/uplot-$UPLOT_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$got" != "$UPLOT_INTEGRITY" ]; then
            echo "::error::uPlot $UPLOT_VERSION does not match its integrity: $got"
            exit 1
          fi
          mkdir -p "$SITE/lib/uplot"
          tar -xzf "$tgz" -C "$SITE/lib/uplot" --strip-components=1 \
            package/LICENSE package/dist/uPlot.iife.min.js package/dist/uPlot.min.css
          mv "$SITE/lib/uplot/dist/"* "$SITE/lib/uplot/"
          rmdir "$SITE/lib/uplot/dist"

      - name: Add marked
        run: |
          tgz="$RUNNER_TEMP/marked.tgz"
          curl -fsSL -o "$tgz" "https://registry.npmjs.org/marked/-/marked-$MARKED_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$got" != "$MARKED_INTEGRITY" ]; then
            echo "::error::marked $MARKED_VERSION does not match its integrity: $got"
            exit 1
          fi
          mkdir -p "$SITE/lib/marked"
          tar -xzf "$tgz" -C "$SITE/lib/marked" --strip-components=1 \
            package/LICENSE package/lib/marked.umd.js
          mv "$SITE/lib/marked/lib/"* "$SITE/lib/marked/"
          rmdir "$SITE/lib/marked/lib"

      # DOMPurify is dual-licensed and ships a text for each licence.
      - name: Add DOMPurify
        run: |
          tgz="$RUNNER_TEMP/dompurify.tgz"
          curl -fsSL -o "$tgz" "https://registry.npmjs.org/dompurify/-/dompurify-$DOMPURIFY_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          if [ "$got" != "$DOMPURIFY_INTEGRITY" ]; then
            echo "::error::DOMPurify $DOMPURIFY_VERSION does not match its integrity: $got"
            exit 1
          fi
          mkdir -p "$SITE/lib/dompurify"
          tar -xzf "$tgz" -C "$SITE/lib/dompurify" --strip-components=1 \
            package/LICENSE package/LICENSE-MPL package/dist/purify.min.js
          mv "$SITE/lib/dompurify/dist/"* "$SITE/lib/dompurify/"
          rmdir "$SITE/lib/dompurify/dist"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE }}

  # Pages sometimes keeps a deployment in syncing_files until deploy-pages gives
  # up, while the same artifact goes through on a later try within minutes.
  # deploy-pages waits 10 minutes at most and cancels the deployment when the
  # time runs out, so each try gets 4 minutes and the next starts afresh after a
  # pause. The job fails only when the third try fails.
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      # Deploys the site.
      pages: write
      # Proves to Pages that the deployment comes from this workflow.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    outputs:
      page_url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: try1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000

      - name: Wait before the second try
        if: steps.try1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages, second try
        id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000

      - name: Wait before the third try
        if: steps.try2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages, third try
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 240000

  # deploy-pages names a deployment after its commit and asks Pages for the
  # status of that name. Every build of one commit shares it, so a deployment
  # Pages never serves still reports the success of an earlier one. This job
  # asks the site itself until its config.json names the database of this run.
  # Each try logs what the site and its cache answer, and the job summary keeps
  # them as a table, so a deployment that never arrives shows where it stops.
  verify:
    name: verify
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Reads the status Pages keeps for the deployment.
      pages: read
      # Reads the statuses of the deployment to github-pages.
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      # Pages lets its cache keep config.json for 10 minutes, so a try within
      # that time can still see the deployment before. The database is asked
      # for only once config.json names it: its cache keeps a 404 far longer.
      - name: Check that Pages serves this build
        run: |
          base="${PAGE_URL%/}"
          db="db/$GITHUB_RUN_ID/gh-stats.sqlite"
          hdr() { tr -d '\r' < "$1" | sed -n "s/^$2: //Ip" | tail -n 1; }

          echo "::group::What GitHub reports for the deployment of $GITHUB_SHA"
          gh api "repos/$GH_REPO/pages/deployments/$GITHUB_SHA" --jq '"Pages status: \(.status)"' || :
          id="$(gh api "repos/$GH_REPO/deployments?environment=github-pages&sha=$GITHUB_SHA&per_page=1" --jq '.[0].id // empty' || :)"
          if [ -n "$id" ]; then
            gh api "repos/$GH_REPO/deployments/$id/statuses" \
              --jq '.[] | "\(.created_at) \(.state) \(.log_url // "")"' || :
          fi
          echo "::endgroup::"

          {
            echo "### Pages and $db"
            echo
            echo "| Try | Time | HTTP | config.json names | Last-Modified | X-Cache | Age | Served by |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          deadline=$((SECONDS + 900))
          try=0
          while :; do
            try=$((try + 1))
            status="$(curl -sS -D "$RUNNER_TEMP/config.h" -o "$RUNNER_TEMP/config.json" -w '%{http_code}' \
              --max-time 60 "$base/config.json" || :)"
            served="$(jq -r '.db // "?"' "$RUNNER_TEMP/config.json" 2>/dev/null || echo '?')"
            row=("$try" "$(date -u +%T)" "${status:-000}" "$served" \
              "$(hdr "$RUNNER_TEMP/config.h" Last-Modified)" "$(hdr "$RUNNER_TEMP/config.h" X-Cache)" \
              "$(hdr "$RUNNER_TEMP/config.h" Age)" "$(hdr "$RUNNER_TEMP/config.h" X-Served-By)")
            echo "try ${row[0]} at ${row[1]}: config.json answers ${row[2]} and names ${row[3]}" \
              "(Last-Modified ${row[4]}, X-Cache ${row[5]}, Age ${row[6]}, ${row[7]}," \
              "request $(hdr "$RUNNER_TEMP/config.h" X-GitHub-Request-Id))"
            (IFS='|'; echo "|${row[*]}|") >> "$GITHUB_STEP_SUMMARY"
            [ "$served" = "$db" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Pages does not serve this build 15 minutes after the deployment; config.json names $served"
              exit 1
            fi
            sleep 30
          done
          status="$(curl -sS -I -o /dev/null -D "$RUNNER_TEMP/db.h" -w '%{http_code}' --max-time 60 "$base/$db" || :)"
          echo "$db answers ${status:-000} (X-Cache $(hdr "$RUNNER_TEMP/db.h" X-Cache)," \
            "Age $(hdr "$RUNNER_TEMP/db.h" Age), request $(hdr "$RUNNER_TEMP/db.h" X-GitHub-Request-Id))"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$db answers ${status:-000}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 200 ]; then
            echo "::error::config.json names $db, but it answers ${status:-000}"
            exit 1
          fi

  report:
    name: report
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Opens, comments on and closes the issue of the results left out.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UNREADABLE: ${{ needs.build.outputs.unreadable }}
    steps:
      # The text names no run, so an unchanged list leaves the issue as it is.
      - name: Report the results left out
        run: |
          number="$(gh issue list --state open --label "$ISSUE_LABEL" --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t))[0].number // empty')"
          if [ "$(jq length <<<"$UNREADABLE")" -eq 0 ]; then
            [ -z "$number" ] || gh issue close "$number" \
              --comment "The build in $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID leaves no result out."
            exit 0
          fi
          echo "::warning::The site leaves out $(jq length <<<"$UNREADABLE") results jq cannot read"
          body="$RUNNER_TEMP/issue.md"
          {
            echo "@$GITHUB_REPOSITORY_OWNER the site leaves out these measurement results, which jq cannot read:"
            echo
            jq -r --arg url "$GITHUB_SERVER_URL/$GH_REPO/blob/$DATA_BRANCH/apps/" '.[] | "- [`\(.)`](\($url + .))"' <<<"$UNREADABLE"
          } > "$body"
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" \
              --assignee "$GITHUB_REPOSITORY_OWNER" --body-file "$body"
          elif [ "$(gh issue view "$number" --json body,comments --jq '[.body, .comments[].body] | last')" != "$(cat "$body")" ]; then
            gh issue comment "$number" --body-file "$body"
          fi
