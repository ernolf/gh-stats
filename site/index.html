<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>gh-stats</title>
	<link rel="stylesheet" href="style.css">
	<script src="lib/sql.js/sql-wasm.js" defer></script>
	<script src="app.js" defer></script>
</head>
<body>
	<header>
		<h1>gh-stats</h1>
		<p>Release downloads of Nextcloud apps and related projects on GitHub.</p>
		<p id="asof"></p>
	</header>

	<main>
		<section id="loading" aria-live="polite">
			<p>Please wait while the database is synchronised&hellip;</p>
			<progress id="progress"></progress>
			<p id="progress-text"></p>
		</section>

		<section id="overview" hidden>
			<label for="filter">Filter</label>
			<input id="filter" type="search" placeholder="app, owner or repository">
			<table>
				<thead>
					<tr>
						<th data-sort="name">App</th>
						<th data-sort="tag">Release</th>
						<th data-sort="published">Published</th>
						<th data-sort="total" class="num">Total</th>
						<th data-sort="d1" class="num">1 day</th>
						<th data-sort="d7" class="num">7 days</th>
						<th data-sort="d30" class="num">30 days</th>
						<th>Compare with</th>
					</tr>
				</thead>
				<tbody id="rows"></tbody>
			</table>
		</section>
	</main>

	<footer>
		<p>Source and documentation: <a href="https://github.com/ernolf/gh-stats">github.com/ernolf/gh-stats</a></p>
	</footer>
</body>
</html>
